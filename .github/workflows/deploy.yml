name: website-monitoring-ci

on:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - "lambda_function/**"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.12"
  TF_VAR_aws_region: ${{ secrets.TF_VAR_aws_region }}
  TF_VAR_email_address: ${{ secrets.TF_VAR_email_address }}
  TF_VAR_urls_to_check: ${{ secrets.TF_VAR_urls_to_check }}
  TF_VAR_check_interval_minutes: ${{ secrets.TF_VAR_check_interval_minutes }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest lambda_function/test_index.py -v

      - name: Run linter
        run: flake8 lambda_function/index.py --max-line-length=88

  plan:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: .terraform
          key: terraform-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false 2>&1 | tee tfplan-output.txt

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-output
          path: tfplan-output.txt
          retention-days: 1