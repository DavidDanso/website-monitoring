name: website-monitoring-ci

on:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - "lambda_function/**"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

# ---------------------------------------------------------------------------
# Least-privilege token permissions — overridden per-job where needed.
# ---------------------------------------------------------------------------
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.7.0"
  TF_VAR_email_address: ${{ secrets.TF_VAR_email_address }}

jobs:
  # -------------------------------------------------------------------------
  # 1. VALIDATE — lint, unit tests, terraform syntax check
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read      
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest lambda_function/test_index.py -v --tb=short

      - name: Run linter
        run: flake8 lambda_function/index.py --max-line-length=88

  # -------------------------------------------------------------------------
  # 2. PLAN — authenticate via static keys, run terraform plan, save binary plan
  # -------------------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Zip Lambda function
        run: zip -j lambda_function.zip lambda_function/index.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .terraform
          key: terraform-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false -out=tfplan.bin 2>&1 | tee tfplan-output.txt
          terraform show -no-color tfplan.bin >> tfplan-output.txt

      - name: Upload binary plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: tfplan-bin
          path: tfplan.bin
          retention-days: 1

      - name: Upload human-readable plan summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: tfplan-output
          path: tfplan-output.txt
          retention-days: 1

  deploy:
    name: Terraform Apply
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.action != 'destroy' }}
    environment: production
    outputs:
      sns_topic_arn: ${{ steps.set_outputs.outputs.sns_topic_arn }}
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Zip Lambda function
        run: zip -j lambda_function.zip lambda_function/index.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .terraform
          key: terraform-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Init
        run: terraform init

      - name: Download binary plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan-bin

      - name: Download plan summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan-output

      - name: Print plan summary
        run: cat tfplan-output.txt

      - name: Terraform Apply
        run: terraform apply -input=false tfplan.bin

      - name: Set Terraform outputs
        id: set_outputs
        run: |
          echo "sns_topic_arn=$(terraform output -raw sns_topic_arn)" >> $GITHUB_OUTPUT

  destroy:
    name: Terraform Destroy
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.action == 'destroy' }}
    environment: production-destroy
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .terraform
          key: terraform-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Init
        run: terraform init

      - name: Confirm destroy target
        run: |
          echo "=========================================="
          echo "  DESTROY requested by: ${{ github.actor }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "=========================================="

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false

  # -------------------------------------------------------------------------
  # 5. NOTIFY — always runs so failures are never silent
  # -------------------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, destroy]
    if: always()
    permissions:
      contents: none
    steps:
      - name: Deployment summary
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          DEPLOYMENT_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo "  Status:      $DEPLOY_STATUS"
          echo "  Triggered:   ${{ github.event_name }}"
          echo "  Actor:       ${{ github.actor }}"
          echo "  Commit SHA:  $SHORT_SHA"
          echo "  SNS ARN:     ${{ needs.deploy.outputs.sns_topic_arn }}"
          echo "  Timestamp:   $DEPLOYMENT_TIMESTAMP"
          echo "=============================="

          if [ "$DEPLOY_STATUS" = "failure" ]; then
            echo "Deploy job FAILED — check logs above."
            exit 1
          fi